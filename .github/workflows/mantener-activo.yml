# Evita que Supabase Free pause el proyecto del portal (lo pausa tras 7 días
# sin actividad; pasa en vacaciones). Llama cada lunes a la función public.ping().
#
# Ojo: GitHub desactiva los workflows programados de un repo sin commits en 60
# días y avisa por correo al dueño. Si llega ese correo, reactivarlo en
# Actions → "Mantener activo Supabase" → Enable workflow. Ver CONTRIBUTING.md.

name: Mantener activo Supabase

on:
  schedule:
    - cron: '17 15 * * 1' # lunes 09:17 CDMX
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a ping()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Portal sin configurar todavía (faltan variables SUPABASE_URL / SUPABASE_ANON_KEY). Nada que hacer."
            exit 0
          fi
          respuesta=$(curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $respuesta"
          [ "$respuesta" = '"ok"' ] || { echo "::error::Supabase no respondió ok. ¿Está pausado? Restaurarlo desde el dashboard."; exit 1; }
